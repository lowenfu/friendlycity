<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>友善營業場所</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        
        .categories {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .category-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 60px 20px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 1.5em;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .category-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        
        .filters {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }
        
        .filters.active {
            display: block;
        }
        
        .filter-group {
            margin-bottom: 15px;
        }
        
        .filter-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        
        .filter-group input,
        .filter-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
        }
        
        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
        }
        
        .checkbox-group label {
            display: flex;
            align-items: center;
            font-weight: normal;
        }
        
        .checkbox-group input[type="checkbox"] {
            width: auto;
            margin-right: 5px;
        }
        
        .results {
            display: none;
        }
        
        .results.active {
            display: block;
        }
        
        .places-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .place-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .place-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        
        .place-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        
        .place-info {
            padding: 15px;
        }
        
        .place-name {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }
        
        .place-detail {
            color: #666;
            margin: 5px 0;
            font-size: 0.95em;
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
        }
        
        .pagination button {
            padding: 10px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
        }
        
        .pagination button:hover:not(:disabled) {
            background: #667eea;
            color: white;
        }
        
        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .pagination button.active {
            background: #667eea;
            color: white;
        }
        
        .back-btn {
            background: #6c757d;
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            margin-bottom: 20px;
        }
        
        .back-btn:hover {
            background: #5a6268;
        }
        
        .admin-link {
            text-align: center;
            margin-top: 20px;
        }
        
        .admin-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
        
        .admin-link a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            .places-grid {
                grid-template-columns: 1fr;
            }
            
            .categories {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>友善營業場所</h1>
        
        <!-- 分類選擇 -->
        <div id="categoriesView" class="categories">
            <button class="category-btn" onclick="selectCategory('餐飲')">🍴 餐飲</button>
            <button class="category-btn" onclick="selectCategory('診所')">🏥 診所</button>
            <button class="category-btn" onclick="selectCategory('藥局')">💊 藥局</button>
            <button class="category-btn" onclick="selectCategory('一般商店')">🏪 一般商店</button>
        </div>
        
        <!-- 篩選器和結果 -->
        <div id="resultsView" class="results">
            <button class="back-btn" onclick="backToCategories()">← 返回分類</button>
            
            <div class="filters active">
                <div class="filter-group">
                    <label>🔍 場所名稱搜尋：</label>
                    <input type="text" id="searchName" placeholder="輸入場所名稱..." oninput="applyFilters()">
                </div>
                
                <div class="filter-group">
                    <label>📅 年度：</label>
                    <select id="yearFilter" onchange="applyFilters()">
                        <option value="">全部年度</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label>📍 地區：</label>
                    <div class="checkbox-group" id="areaCheckboxes"></div>
                </div>
            </div>
            
            <div id="placesContainer" class="places-grid"></div>
            
            <div class="pagination" id="pagination"></div>
        </div>
        
        <div class="admin-link">
            <a href="admin.html">📝 後台管理</a>
        </div>
    </div>

    <script>
        // 使用 HTTPS API endpoint
        const API_URL = 'https://your-api-server.com/api';
        const CDN_URL = 'https://cdn.jsdelivr.net/gh/yourusername/friendly-places@main/images';
        
        let allData = [];
        let filteredData = [];
        let currentCategory = '';
        let currentPage = 1;
        const itemsPerPage = 9;
        
        // 初始化：從 API 載入資料
        async function loadData() {
            try {
                // 使用 HTTPS 請求
                const response = await fetch(`${API_URL}/places`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error('載入資料失敗');
                }
                
                allData = await response.json();
                
                // 依最後修改時間排序（最近的在前）
                allData.sort((a, b) => {
                    return new Date(b.最後修改時間) - new Date(a.最後修改時間);
                });
            } catch (error) {
                console.error('載入資料失敗:', error);
                // 使用範例資料作為備援
                allData = [
                    {"名稱":"全家牛排館","年度":"103","分類":"餐飲","電話":"076222344","地址":"高雄市岡山區大德一路26號","區域":"岡山區","網址連結":"店家連結","友善特色":"1.無障礙入口\n2.無障礙廁所","最後修改時間":"2025-02-01"},
                    {"名稱":"人从众厚切牛排- 鳳山文濱店","年度":"112","分類":"餐飲","電話":"07 7775718","地址":"高雄市鳳山區文濱路130號","區域":"鳳山區","網址連結":"店家連結","友善特色":"1.無障礙入口\n2.無障礙廁所","最後修改時間":"2025-01-02"},
                    {"名稱":"泮咖啡","年度":"113","分類":"餐飲","電話":"07 585 6868","地址":"高雄市左營區蓮潭路176號","區域":"左營區","網址連結":"店家連結","友善特色":"1..大門為前後推拉門，常保開啟狀態\n2.出入口有兩格階梯，大門左側設有斜坡道，坡道長度約4公尺，坡度約15~25度輪椅使用者不需有人協助\n3.商家歡迎導盲犬進入\n4.主要通道輪椅使用者可雙向通行\n5.桌下有足夠容膝空間，且椅子有靠背，輪椅使用者可自行調整至方便用餐空間\n6.商家有設置友善充電座、友善優先席及兒童座椅，供行動不便者跟兒童使用","最後修改時間":"2025-01-03"}
                ];
                
                allData.sort((a, b) => {
                    return new Date(b.最後修改時間) - new Date(a.最後修改時間);
                });
            }
        }
        
        function selectCategory(category) {
            currentCategory = category;
            currentPage = 1;
            
            // 隱藏分類，顯示結果
            document.getElementById('categoriesView').style.display = 'none';
            document.getElementById('resultsView').classList.add('active');
            
            // 初始化篩選器
            initFilters();
            
            // 顯示該分類的資料
            applyFilters();
        }
        
        function backToCategories() {
            document.getElementById('categoriesView').style.display = 'grid';
            document.getElementById('resultsView').classList.remove('active');
            currentCategory = '';
            
            // 清空篩選器
            document.getElementById('searchName').value = '';
            document.getElementById('yearFilter').value = '';
            document.querySelectorAll('#areaCheckboxes input[type="checkbox"]').forEach(cb => {
                cb.checked = false;
            });
        }
        
        function initFilters() {
            // 篩選當前分類的資料
            const categoryData = allData.filter(item => item.分類 === currentCategory);
            
            // 填入年度選項
            const years = [...new Set(categoryData.map(item => item.年度))].sort((a, b) => b - a);
            const yearSelect = document.getElementById('yearFilter');
            yearSelect.innerHTML = '<option value="">全部年度</option>';
            years.forEach(year => {
                yearSelect.innerHTML += `<option value="${year}">${year}</option>`;
            });
            
            // 填入地區選項
            const areas = [...new Set(categoryData.map(item => item.區域))].sort();
            const areaCheckboxes = document.getElementById('areaCheckboxes');
            areaCheckboxes.innerHTML = '';
            areas.forEach(area => {
                areaCheckboxes.innerHTML += `
                    <label>
                        <input type="checkbox" value="${area}" onchange="applyFilters()">
                        ${area}
                    </label>
                `;
            });
        }
        
        function applyFilters() {
            // 取得篩選條件
            const searchName = document.getElementById('searchName').value.toLowerCase();
            const selectedYear = document.getElementById('yearFilter').value;
            const selectedAreas = Array.from(document.querySelectorAll('#areaCheckboxes input[type="checkbox"]:checked'))
                .map(cb => cb.value);
            
            // 篩選資料
            filteredData = allData.filter(item => {
                // 分類篩選
                if (item.分類 !== currentCategory) return false;
                
                // 名稱篩選（模糊比對）
                if (searchName && !item.名稱.toLowerCase().includes(searchName)) return false;
                
                // 年度篩選
                if (selectedYear && item.年度 !== selectedYear) return false;
                
                // 地區篩選
                if (selectedAreas.length > 0 && !selectedAreas.includes(item.區域)) return false;
                
                return true;
            });
            
            // 依最後修改時間排序（最近的在前）
            filteredData.sort((a, b) => {
                return new Date(b.最後修改時間) - new Date(a.最後修改時間);
            });
            
            currentPage = 1;
            renderResults();
        }
        
        function renderResults() {
            const container = document.getElementById('placesContainer');
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageData = filteredData.slice(startIndex, endIndex);
            
            if (pageData.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #999; padding: 40px;">沒有符合的資料</p>';
            } else {
                container.innerHTML = pageData.map(place => {
                    // 使用 CDN 提供的預設圖片或自訂圖片
                    const imageUrl = place.圖片 || `https://via.placeholder.com/400x300/667eea/ffffff?text=${encodeURIComponent(place.名稱)}`;
                    
                    return `
                        <div class="place-card">
                            <img src="${imageUrl}" alt="${place.名稱}" onerror="this.src='https://via.placeholder.com/400x300/667eea/ffffff?text=No+Image'">
                            <div class="place-info">
                                <div class="place-name">${place.名稱}</div>
                                <div class="place-detail">📅 年度：${place.年度}</div>
                                <div class="place-detail">📍 ${place.地址}</div>
                                <div class="place-detail">🏷️ 類型：${place.分類}</div>
                                <div class="place-detail">📌 區域：${place.區域}</div>
                                <div class="place-detail">📞 ${place.電話}</div>
                                <div class="place-detail" style="white-space: pre-line; margin-top: 10px;">♿ ${place.友善特色}</div>
                            </div>
                        </div>
                    `;
                }).join('');
            }
            
            renderPagination();
        }
        
        function renderPagination() {
            const totalPages = Math.ceil(filteredData.length / itemsPerPage);
            const pagination = document.getElementById('pagination');
            
            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }
            
            let html = '';
            
            // 上一頁
            html += `<button ${currentPage === 1 ? 'disabled' : ''} onclick="changePage(${currentPage - 1})">上一頁</button>`;
            
            // 頁碼
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                    html += `<button class="${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
                } else if (i === currentPage - 3 || i === currentPage + 3) {
                    html += `<span>...</span>`;
                }
            }
            
            // 下一頁
            html += `<button ${currentPage === totalPages ? 'disabled' : ''} onclick="changePage(${currentPage + 1})">下一頁</button>`;
            
            pagination.innerHTML = html;
        }
        
        function changePage(page) {
            currentPage = page;
            renderResults();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        // 頁面載入時初始化
        loadData();
    </script>
</body>
</html>
